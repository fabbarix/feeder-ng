<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e7f4eb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#090f0b" />
    <meta name="description" content="Feeder: family meal planning" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#34724e" />
    <title>Feeder</title>
    <!-- B9-49 (RES-08): a returning User's theme before the first paint, from the cache the settings feature writes (theme/themeCache).
         It sets data-scheme, the six --boot-* colours, theme-color and data-boot="shell" (the skeleton below); with no cache, nothing.
         No CSP is sent today; if one is added, this script needs its hash. -->
    <script>
(function () {
  try {
    var t = JSON.parse(localStorage.getItem('feeder.theme') || 'null'), r = document.documentElement, h = /^#[0-9a-f]{6}$/i;
    if (!t) return;
    var k = t.scheme === 'system' ? (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t.scheme;
    var p = (k === 'dark' || k === 'light') && t[k];
    if (!p) return;
    var c = { '--boot-bg': p.bg, '--boot-surface': p.surface, '--boot-surface-2': p.surface2, '--boot-line': p.line, '--boot-text': p.text, '--boot-accent': p.accent };
    for (var n in c) if (!h.test(c[n])) return;
    for (n in c) r.style.setProperty(n, c[n]);
    r.dataset.scheme = k;
    r.style.colorScheme = k;
    document.querySelectorAll('meta[name=theme-color]').forEach(function (m) { m.setAttribute('content', p.bg); });
    r.dataset.boot = 'shell';
  } catch (e) {}
})();
    </script>
    <!-- Boot paint: the page background in the right scheme before React mounts (no white flash in dark). A returning User gets the
         shell skeleton (mock res-08-boot-shell) in their own colours; a first visit gets the centred mark, and then, once the app's
         code runs and the User is not known yet, the same skeleton drawn by app/BootShell.tsx ([data-live], the app's own tokens). -->
    <style>
      html { background: #e7f4eb; }
      @media (prefers-color-scheme: dark) {
        html:not([data-scheme='light']) { background: #090f0b; }
      }
      html[data-scheme='dark'] { background: #090f0b; }
      /* A returning User (the script above found their theme): their own ground and text. theme/apply.ts keeps --boot-bg on the live
         theme's ground afterwards, so a scheme or accent changed later is not left behind the page (overscroll). */
      html[data-boot='shell'] { background: var(--boot-bg, #e7f4eb); color: var(--boot-text, #131d17); }
      /* Centred Family Pot mark until React mounts. The rule matches only while the mark is in #root, so the app is unaffected. */
      #root:has(> .boot-mark) { display: grid; place-items: center; min-height: 100dvh; }
      .boot-mark { display: grid; justify-items: center; gap: 8px; font-weight: 700; }
      .boot-shell { display: none; }
      html[data-boot='shell'] .boot-mark { display: none; }
      html[data-boot='shell'] #root:has(> .boot-mark) { display: block; place-items: normal; }
      .boot-shell[data-live], html[data-boot='shell'] .boot-shell { display: grid; inline-size: 100%; min-height: 100dvh; grid-template-columns: minmax(0, 1fr); grid-template-rows: 64px 1fr; align-content: start; font-family: system-ui, sans-serif; }
      html[data-boot='shell'] body { margin: 0; }
      .boot-shell__page > span { display: block; }
      .boot-shell__top { display: flex; align-items: center; justify-content: space-between; padding-inline: 16px; }
      .boot-shell__brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 20px; color: var(--boot-text); }
      .boot-shell__brand svg { color: var(--boot-accent); }
      .boot-shell__avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--boot-surface-2); }
      .boot-shell__page { padding: 8px 16px 120px; display: grid; gap: 12px; align-content: start; }
      .boot-shell__title { width: 40%; height: 32px; border-radius: 999px; background: var(--boot-surface-2); }
      .boot-shell__tile { height: 193px; border-radius: 28px; background: var(--boot-surface); border: 1px solid var(--boot-line); }
      .boot-shell__tile + .boot-shell__tile { height: 160px; }
      .boot-shell__bar { position: fixed; left: 12px; right: 12px; bottom: 12px; height: 70px; max-width: 480px; margin-inline: auto; border-radius: 24px; background: var(--boot-surface); border: 1px solid var(--boot-line); }
      .boot-shell__rail { display: none; }
      @media (min-width: 600px) { .boot-shell__page { padding-inline: 24px; } .boot-shell__tile { height: 208px; } }
      @media (min-width: 1024px) {
        .boot-shell[data-live], html[data-boot='shell'] .boot-shell { grid-template-columns: 88px 1fr; grid-template-rows: 64px 1fr; }
        .boot-shell__top { grid-column: 1 / -1; padding-inline: 32px; }
        .boot-shell__rail { display: grid; gap: 8px; align-content: start; justify-items: center; padding-top: 12px; }
        .boot-shell__rail span { width: 56px; height: 56px; border-radius: 16px; background: var(--boot-surface-2); opacity: .6; }
        .boot-shell__bar { display: none; }
        .boot-shell__page { padding: 8px 32px; max-width: 1128px; inline-size: 100%; box-sizing: border-box; }
        .boot-shell__tile { height: 220px; }
      }
      @media (prefers-reduced-motion: no-preference) { .boot-shell__tile, .boot-shell__title { animation: boot-pulse 1.6s ease-in-out infinite; } }
      @keyframes boot-pulse { 50% { opacity: .65; } }
    </style>
  </head>

><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="boot-shell__page" aria-hidden="true"><span class="boot-shell__title"></span><span class="boot-shell__tile"></span><span class="boot-shell__tile"></span></div><div class="boot-shell__bar" aria-hidden="true"></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
