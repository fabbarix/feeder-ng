<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>round 1 header</title>
<!-- hf-recipes-filter round 2: the header of bb354d3c with the panel open, at /recipes?course=Side&tag=<long Tag>. The guard must report P17 (390), P18, P19 (834, 1440) and P20. -->
<style>
  body { margin: 0; font: 15px/20px sans-serif }
  main { padding: 0 16px }
  .list-page { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px }
  .chip { display: inline-flex; align-items: center; gap: 4px; block-size: 26px; padding: 0 10px; border-radius: 999px; background: #eee; white-space: nowrap; font: 700 12px/16px sans-serif; border: 0; box-sizing: border-box }
  .chip__dot { inline-size: 8px; block-size: 8px; border-radius: 50%; background: teal; flex: none }
  .chip__label { min-width: 0; overflow: hidden; text-overflow: ellipsis }
  .chip__remove { display: inline-flex; flex: none; inline-size: 14px }
  .chip[data-removable] { position: relative }
  .chip[data-removable]::before { content: ''; position: absolute; inset: -9px 0 }
  button.chip:focus-visible { outline: 3px solid #b33; outline-offset: 2px }
  .recipe-filters__row, .recipe-filters__chips { display: flex; flex-wrap: nowrap; align-items: center; gap: 8px; min-inline-size: 0 }
  .recipe-filters__search-row > .ui-field { flex: 1 1 auto; min-inline-size: 0 }
  .recipe-filters__search-row input { inline-size: 100%; box-sizing: border-box; block-size: 44px }
  .recipe-filters__search-row > .button { flex: none; block-size: 36px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px }
  .recipe-filters__view-row { justify-content: space-between }
  .recipe-filters__view-row > .ui-field:first-child { flex: none }
  .segmented { display: flex; gap: 4px; padding: 4px; inline-size: max-content; background: #eee; border-radius: 12px }
  .segmented__option { flex: none; padding: 0 8px; min-block-size: 40px; white-space: nowrap; border: 0; font: 700 13px/16px sans-serif }
  .recipe-filters__sort { flex: 0 1 auto; min-inline-size: 0 }
  .select__trigger { display: flex; align-items: center; gap: 4px; max-inline-size: 100%; block-size: 36px; padding: 0 10px; border-radius: 999px; border: 1px solid #888; background: none; font: 700 13px/16px sans-serif; box-sizing: border-box }
  .select__value { min-inline-size: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .recipe-filters__more { flex: none }
  .anchor-wrap { position: relative; flex: none }
  .popover { box-sizing: border-box; inline-size: min(24rem, 100vw - 32px); padding: 16px; background: #fff; box-shadow: 0 2px 8px #0003; border-radius: 20px; z-index: 2 }
  .recipe-filters__heading { margin: 0; font: 700 13px/16px sans-serif }
  .course-filter { display: flex; flex-wrap: nowrap; gap: 8px; overflow-x: auto; scrollbar-width: none }
  .course-filter > .chip { flex: none }
  /* bb354d3c as the review saw it: the chip line clips (hit areas and rings cut), both chips shown with the Tag cut, the Course
     line scrolls with no padding (the ring of All Courses cut), row 3 flush under row 2, sections not spaced, the popover
     start-aligned under the Filters button (past the page at 834 and 1440). */
  .list-page__filters { display: block }
  .recipe-filters__chips { overflow: hidden }
  .recipe-filters__chips > .chip { flex: 0 1 auto; min-inline-size: 4.5rem }
  .popover { position: absolute; top: 100%; left: 0 }
  .recipe-filters__section { display: flex; flex-direction: column; gap: 8px }
</style>
<script>const mq = matchMedia('(prefers-color-scheme: dark)'); const set = () => { document.documentElement.dataset.scheme = mq.matches ? 'dark' : 'light' }; set(); mq.addEventListener('change', set)</script></head><body>
<main><div class="page" data-page-width="wide"><div class="list-page recipes-screen">
  <div class="list-page__header"><h1>Recipes</h1></div>
  <div class="list-page__search">
    <div class="recipe-filters__row recipe-filters__search-row">
      <div class="ui-field"><input type="search" aria-label="Search Recipes" placeholder="Search Recipes"></div>
      <div class="anchor-wrap">
        <button class="button" type="button" aria-label="Filters, 2 active" aria-haspopup="dialog" aria-expanded="true" aria-controls="recipe-filters">Filters <span class="chip" aria-hidden="true"><span class="chip__label">2</span></span></button>
        <div id="recipe-filters" class="popover recipe-filters__panel" role="dialog" aria-label="Filters">
          <h2>Filters</h2>
          <section class="recipe-filters__section"><h3 class="recipe-filters__heading">Course</h3>
          <div class="course-filter" role="group" aria-label="Filter by Course"><button class="chip" type="button" aria-pressed="false">All Courses</button><button class="chip" type="button" aria-pressed="false">Main</button><button class="chip" type="button" aria-pressed="true">Side</button><button class="chip" type="button" aria-pressed="false">Starter</button><button class="chip" type="button" aria-pressed="false">Dessert</button><button class="chip" type="button" aria-pressed="false">Breakfast extras</button></div></section>
        <section class="recipe-filters__section"><h3 class="recipe-filters__heading">Tag</h3><input type="search" aria-label="Search Tags" placeholder="Search Tags"></section>
        </div>
      </div>
    </div>
  </div>
  <div class="list-page__filters">
    <div class="recipe-filters__row recipe-filters__view-row">
      <div class="ui-field"><div class="segmented" role="radiogroup" aria-label="Kind"><button class="segmented__option" role="radio" aria-checked="true">Recipes</button><button class="segmented__option" role="radio" aria-checked="false">Base recipes</button></div></div>
      <div class="recipe-filters__sort"><div class="ui-field"><button class="select__trigger" role="combobox" aria-label="Sort"><span>&#8597;</span><span class="select__value">Name</span><span>&#9662;</span></button></div></div>
    </div>
    <div class="recipe-filters__chips" role="group" aria-label="Active filters">
      <button class="chip" type="button" data-removable aria-label="Remove Course: Side"><span class="chip__label">Side</span><span class="chip__remove">&#215;</span></button>
      <button class="chip" type="button" data-removable aria-label="Remove Tag: extraordinarily long family favourite weeknight tag"><span class="chip__dot"></span><span class="chip__label">extraordinarily long family favourite weeknight tag</span><span class="chip__remove">&#215;</span></button>
    </div>
  </div>
  <div class="list-page__list"><p>Cucumber tomato feta salad</p></div>
</div></div></main>
<script>
  // Round 3: the round-2 chip line looped between 420 and 440 px (React #185) and the page showed the error page. The guard's
  // RESIZE_WALK (P21) must see the console error, the uncaught exception and the error page at those widths only.
  if (innerWidth >= 420 && innerWidth <= 440) {
    document.querySelector('main').innerHTML = '<div class="page" data-page-width="wide"><h1>Something went wrong</h1></div>'
    console.error('Maximum update depth exceeded')
    setTimeout(() => { throw new Error('Minified React error #185') }, 0)
  }
</script></body></html>
