<!doctype html><html data-scheme="light"><head><meta charset="utf-8"><title>pending</title>
<!-- DS-TODAY round 2: the metric strip in the Today grid. A lone metric is not stretched into a full-width block; the icon sits top-right
     beside the number (mockup). The markup is what <MetricStrip> renders. Read by ds-layout_test.sh. -->
<link rel="stylesheet" href="../../../../web/node_modules/@fontsource/figtree/500.css"><link rel="stylesheet" href="../../../../web/node_modules/@fontsource/figtree/800.css">
<link rel="stylesheet" href="../../../../web/src/styles.css"><link rel="stylesheet" href="../../../../web/src/ui/Tile.css"><link rel="stylesheet" href="../../../../web/src/ui/BentoGrid.css">
<link rel="stylesheet" href="../../../../web/src/features/today/today.css">
<style>body { margin: 0; font-family: 'Figtree', sans-serif; }</style>
</head><body>
<script>
const tileHtml = (id, v, l) => `<section class="tile" data-variant="status" data-status="success" data-metric="${id}" aria-label="${l}"><span class="today-metric__icon" aria-hidden="true"><svg width="20" height="20"></svg></span>
  <span class="tile-metric"><span class="tile-metric__value">${v}</span><span class="tile-metric__label">${l}</span></span></section>`
const strip = (id, tiles) => `<div class="today"><div class="today-metrics" id="${id}"><div class="bento-grid" data-min="metric" role="group">${tiles}</div></div></div>`
document.body.insertAdjacentHTML('beforeend', '<div style="inline-size:1000px">' + strip('lone', tileHtml('streak', '2 d', 'zero-waste streak')) + '</div><div style="inline-size:1000px;margin-top:24px">' +
  strip('three', tileHtml('streak', '2 d', 'zero-waste streak') + tileHtml('lines', '16', 'Lines to get')) + '</div>')
const w = (sel) => Math.round(document.querySelector(sel).getBoundingClientRect().width)
const t = document.querySelector('#lone [data-metric]').getBoundingClientRect(), i = document.querySelector('#lone .today-metric__icon').getBoundingClientRect(),
  v = document.querySelector('#lone .tile-metric__value').getBoundingClientRect()
document.title = JSON.stringify({ loneW: w('#lone [data-metric]'), twoW: w('#three [data-metric]'), iconTopRight: i.right > t.right - 40 && i.top < t.top + 40, iconBesideValue: i.left >= v.right - 1 || i.top < v.top + 4 })
</script></body></html>
