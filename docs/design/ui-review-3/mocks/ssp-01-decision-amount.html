<html lang="en" data-scheme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>What a tick records (mock)</title><link rel="stylesheet" href="app.css"><style data-theme>html[data-scheme=light]{--color-bg: #e7f4eb; --color-surface: #fafffc; --color-surface-2: #daecdf; --color-surface-3: #c8e0cf; --color-line: #c2d7c9; --color-outline: #677a6d; --color-text: #131d17; --color-muted: #4b5a4f; --color-accent: #34724e; --color-on-accent: #ffffff; --color-accent-text: #135533; --color-soft: #bfebcd; --color-soft-strong: #9addb2; --color-background: #e7f4eb; --color-on-background: #131d17; --color-surface-container-low: #fafffc; --color-surface-container: #daecdf; --color-surface-container-high: #c8e0cf; --color-on-surface: #131d17; --color-on-surface-variant: #4b5a4f; --color-primary: #34724e; --color-on-primary: #ffffff; --color-primary-container: #bfebcd; --color-on-primary-container: #135533; --color-secondary: #34724e; --color-on-secondary: #ffffff; --color-secondary-container: #bfebcd; --color-on-secondary-container: #135533; --status-leftover-fg: #065353; --status-leftover-bg: #c2f3f2; --status-leftover-solid: #027879; --status-spoil-fg: #6d3706; --status-spoil-bg: #fee1cf; --status-spoil-solid: #9e5106; --status-danger-fg: #742e2b; --status-danger-bg: #ffe0dc; --status-danger-solid: #ab413e; --status-success-fg: #115629; --status-success-bg: #d1f2d7; --status-success-solid: #0a7e3a; --status-pinned-fg: #3e3f7c; --status-pinned-bg: #e3e6fe; --status-pinned-solid: #5b5cb7; color-scheme: light;}
html[data-scheme=dark]{--color-bg: #090f0b; --color-surface: #131c16; --color-surface-2: #1e2a22; --color-surface-3: #28372d; --color-line: #303f35; --color-outline: #788c7f; --color-text: #e9f1ec; --color-muted: #aebbb2; --color-accent: #89c8a0; --color-on-accent: #051b0e; --color-accent-text: #a2e3b9; --color-soft: #143c25; --color-soft-strong: #144f30; --color-background: #090f0b; --color-on-background: #e9f1ec; --color-surface-container-low: #131c16; --color-surface-container: #1e2a22; --color-surface-container-high: #28372d; --color-on-surface: #e9f1ec; --color-on-surface-variant: #aebbb2; --color-primary: #89c8a0; --color-on-primary: #051b0e; --color-primary-container: #143c25; --color-on-primary-container: #a2e3b9; --color-secondary: #89c8a0; --color-on-secondary: #051b0e; --color-secondary-container: #143c25; --color-on-secondary-container: #a2e3b9; --status-leftover-fg: #85e4e3; --status-leftover-bg: #043535; --status-leftover-solid: #027879; --status-spoil-fg: #fec39b; --status-spoil-bg: #44250c; --status-spoil-solid: #9e5106; --status-danger-fg: #febfb9; --status-danger-bg: #47211e; --status-danger-solid: #ab413e; --status-success-fg: #a7e2b2; --status-success-bg: #14361d; --status-success-solid: #0a7e3a; --status-pinned-fg: #c7cdff; --status-pinned-bg: #282a4b; --status-pinned-solid: #5b5cb7; color-scheme: dark;}</style><style data-board>
body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:Figtree,system-ui,sans-serif}
.board{display:flex;gap:24px;padding:20px;align-items:flex-start;flex-wrap:wrap}
.frame{inline-size:390px;flex:none;display:grid;gap:12px;align-content:start}
.frame__cap{margin:0;font:var(--text-label-weight) var(--text-label-size)/var(--text-label-line) Figtree,sans-serif;color:var(--color-muted);text-transform:uppercase;letter-spacing:.04em}
.frame__cap b{color:var(--color-text)}
.frame .toast{position:static;inline-size:auto}

/* Round 1 and 2 shared rules R-A to R-F (copied from the PC mocks' shared block so every theme looks the same) */
/* DS-12 IconButton: a 1 px --color-outline boundary on every surface; fill surface-2 on surface, --color-surface on a tinted
   tile (status or soft); on the light accent hero the fill is the boundary. Specific outline buttons below override it. */
.icon-button{box-shadow:inset 0 0 0 1px var(--color-outline)}
.tile[data-variant="soft"] .icon-button{background:var(--color-surface)}
html[data-scheme="light"] .tile[data-variant="hero"] .icon-button{box-shadow:none}
/* R-A Buttons look like buttons. A secondary button has a fill AND a 1 px --color-outline boundary on every surface
   (outline vs surface 4.5 / 4.9, vs status tints 3.7-4.0 light and dark). On a tinted tile (status, soft) its fill is --color-surface.
   Tertiary (bare text) buttons are not used as actions in tiles, notices, toasts or sheet footers. */
.button[data-variant="secondary"]{background:var(--color-surface);box-shadow:inset 0 0 0 1px var(--color-outline)}
.tile[data-variant="status"] .icon-button,.pc-lo .icon-button,.pc-alert .icon-button{background:var(--color-surface);box-shadow:inset 0 0 0 1px var(--color-outline)}
.sheet .button[data-variant="secondary"],.dialog .button[data-variant="secondary"]{background:var(--color-surface)}
.button[data-variant="danger-tertiary"]{background:var(--color-surface);box-shadow:inset 0 0 0 1px var(--status-danger-fg);color:var(--status-danger-fg)}
/* R-B Close: one circular outline icon button, 40 px (52 px target through the existing ::after), never stretched; top-aligned with the title. */
.pc-close{flex:none;align-self:flex-start;inline-size:40px;block-size:40px;border-radius:999px;background:transparent;box-shadow:inset 0 0 0 1px var(--color-outline);color:var(--color-text)}
.sheet__header{align-items:flex-start}
/* R-C Focus rings are never clipped: every scroll container that holds controls keeps 5 px of room (3 px ring + 2 px offset);
   nested controls are inset inside their container's padding; sticky bars set scroll-padding so a focused control is never under them. */
.sheet__body{padding-block:5px;scroll-padding-block:5px}
.pc-focus{outline:3px solid var(--color-accent);outline-offset:2px}
.toast .pc-focus,.toast :focus-visible{outline-color:var(--color-bg)}
/* R-D A toast with detail: icon | headline (body-strong), muted subline (meta), optional body (body), actions as real outline buttons; Dismiss top-right. */
.toast{align-items:center}
.toast .toast__message{flex:1 1 auto;min-width:0}
.pc-toast-rich{align-items:flex-start;padding:14px 10px 14px 18px}
/* R-D+: the status icon (16 px) is part of the headline line, centred on its text; a success toast has none */
.pc-toast__head{display:flex;align-items:center;gap:var(--space-2)}
.pc-toast__icon{display:inline-grid;place-items:center;flex:none;block-size:var(--text-body-strong-line)}
.toast[data-status="error"] .pc-toast__icon{color:var(--status-danger-bg)}
.pc-toast__text{flex:1 1 auto;min-width:0;display:grid;gap:2px}
.pc-toast__text p{margin:0}
.pc-toast__head{font-size:var(--text-body-strong-size);line-height:var(--text-body-strong-line);font-weight:700}
.pc-toast__sub{font-size:var(--text-meta-size);line-height:var(--text-meta-line);color:color-mix(in srgb,var(--color-bg) 72%,var(--color-text))}
.pc-toast__body{font-size:var(--text-body-size);line-height:var(--text-body-line);margin-top:4px!important}
.pc-toast__actions{display:flex;gap:var(--space-2);margin-top:var(--space-2)}
.pc-tbtn{flex:none;min-block-size:40px;padding-inline:var(--space-4);border-radius:999px;background:transparent;color:var(--color-bg);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--color-bg) 70%,transparent);font-weight:700}
.pc-toast-rich .pc-tclose{align-self:flex-start}
.pc-tclose{flex:none;inline-size:32px;block-size:32px;border-radius:999px;background:transparent;color:var(--color-bg);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--color-bg) 55%,transparent)}
/* R-C+ Nested focus rings: a control inside a container that has its own visible boundary (a timer pill, a status tile, a
   rail timer tile, a chip with a remove button) draws its ring INSIDE itself: 2 px --color-accent at outline-offset -2 px on a
   --color-soft fill. While a child has focus, a container whose boundary is accent-coloured steps it back to its neutral 1 px
   --color-outline, so only one accent ring is ever visible; at least 4 px of fill always separates the two lines. */
.pc-nested:focus-visible,.pc-nested[data-focus]{outline:2px solid var(--color-accent);outline-offset:-2px;background:var(--color-soft)}
/* R-E Structured rows, not bullet lists: an item with a key, a state and detail is a row - key body-strong, state at the end
   (body-strong, tabular figures, status colour), detail under the key in meta, muted; rows separated by 1 px --color-line. */
.pc-srows{list-style:none;margin:0;padding:0;display:grid}
.pc-srow{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:var(--space-3);row-gap:2px;padding-block:var(--space-2);border-top:1px solid color-mix(in srgb,currentColor 18%,transparent)}
.pc-srow:first-child{border-top:0}
.pc-srow__key{font-size:var(--text-body-strong-size);line-height:var(--text-body-strong-line);font-weight:700;color:var(--color-text)}
.pc-srow__state{font-size:var(--text-body-strong-size);line-height:var(--text-body-strong-line);font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.pc-srow__detail{grid-column:1/-1;font-size:var(--text-meta-size);line-height:var(--text-meta-line);color:var(--color-muted);font-variant-numeric:tabular-nums}
/* R-F Bottom bar under 360 px (DS-02, decision DS 1): icon only; the current-page highlight and Scan are 44 px squircles
   (equal width and height) centred in their track, fully inside the bar. At 320 the bar is 312 px with 6 px inline padding, so a
   track is 42.9 px: the squircles are 40 px (radius 12 px), leaving at least 7 px to the bar's edge; the whole track (43 x 64 px)
   stays the tap target. */
@media (width < 22.5em){
  .bottom-bar{left:calc(var(--space-1) + env(safe-area-inset-left,0px));right:calc(var(--space-1) + env(safe-area-inset-right,0px));column-gap:0;padding-inline:6px}
  .bottom-bar__label{position:absolute;inline-size:1px;block-size:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  .bottom-bar__link{min-width:0;inline-size:40px;block-size:40px;justify-self:center;border-radius:12px;gap:0}
  .bottom-bar__link[data-accent="true"]{inline-size:40px;block-size:40px;border-radius:12px;box-shadow:none}
}
/* SSP round 2: count badges are 24 px round shapes (never ovals), 8 px clear of the text before them */
.shop-section__count,.list-group__count,.shop-notice__count{display:inline-grid;place-items:center;box-sizing:border-box;block-size:24px;min-inline-size:24px;padding-inline:7px;border-radius:999px;line-height:1;flex:none;margin-inline-start:var(--space-1)}
/* R-C+ for SSP: the tick circle (inside a row card; its visible 24 px circle IS the ring: 3 px accent on a soft fill, one ring only) and the Price keypad keys (8 px apart) draw their ring inside themselves */
.line-row__tick[data-focus]{outline:none}
.line-row__tick[data-focus]::before{border:3px solid var(--color-accent);background:var(--color-soft)}
.price-keypad__key[data-focus]{outline:2px solid var(--color-accent);outline-offset:-2px;background:var(--color-soft)}
/* SSP: tinted-surface icon buttons (camera bar, notices) follow R-A too */
.viewfinder-strip[data-size=bar] .button,.tile[data-variant=status] .button[data-variant=secondary]{background:var(--color-surface);box-shadow:inset 0 0 0 1px var(--color-outline)}


/* SSP-01: a ticked row says what the tick did to Stock in its one meta line; the title stays struck through. */
.list-row[data-state='ticked'] .list-row__meta { text-decoration: none; }
.list-row[data-state='ticked'] .list-row__meta:not([data-status]) { color: var(--color-muted); }
/* the toast's second action (Change) sits beside Undo, both tertiary on the inverse surface */
.toast .button[data-variant='tertiary'] + .button[data-variant='tertiary'] { margin-inline-start: calc(-1 * var(--space-2)); }
</style></head><body><div class="board"><div class="frame"><p class="frame__cap"><b>Option A</b> · the Line's need (today)</p><div class="list-group" data-primary-scope=""><ul class="list-group__list" aria-label="Ticked"><li class="list-row" data-height="72" data-state="ticked" ><span class="list-row__control"><button aria-label="Tick Garlic" aria-pressed="true" class="line-row__tick" type="button"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true" class="ph-icon"><path d="M232.49,80.49l-128,128a12,12,0,0,1-17,0l-56-56a12,12,0,1,1,17-17L96,183,215.51,63.51a12,12,0,0,1,17,17Z"></path></svg></button></span><button aria-haspopup="dialog" aria-label="Garlic" class="list-row__target" type="button"></button><span class="list-row__leading"><span aria-hidden="true" class="thumb" data-monogram="true" data-size="40"><span class="thumb__monogram">G</span></span></span><span class="list-row__text"><span class="list-row__title">Garlic</span><span class="list-row__meta" data-status="success"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true" class="ph-icon"><path d="M225.6,62.64l-88-48.17a19.91,19.91,0,0,0-19.2,0l-88,48.17A20,20,0,0,0,20,80.19v95.62a20,20,0,0,0,10.4,17.55l88,48.17a19.89,19.89,0,0,0,19.2,0l88-48.17A20,20,0,0,0,236,175.81V80.19A20,20,0,0,0,225.6,62.64ZM128,36.57,200,76,178.57,87.73l-72-39.42Zm0,78.83L56,76,81.56,62l72,39.41ZM44,96.79l72,39.4v76.67L44,173.44Zm96,116.07V136.19l24-13.13V152a12,12,0,0,0,24,0V109.92l24-13.13v76.65Z"></path></svg><span class="list-row__meta-text">+150 g in Stock</span></span></span><span class="list-row__value">150 g</span></li></ul></div><div class="toast pc-toast-rich" data-status="success"><div class="pc-toast__text"><p class="pc-toast__head">Garlic ticked</p><p class="pc-toast__sub">150 g added to Stock</p><div class="pc-toast__actions"><button class="button pc-tbtn" data-size="sm" type="bu 4v76.67L44,173.44Zm96,116.07V136.19l24-13.13V152a12,12,0,0,0,24,0V109.92l24-13.13v76.65Z"></path></svg><span class="list-row__meta-text">+500 g in Stock</span></span></span><span class="list-row__value">150 g</span></li></ul></div><div class="toast pc-toast-rich" data-status="success"><div class="pc-toast__text"><p class="pc-toast__head">Garlic ticked</p><p class="pc-toast__sub">500 g added to Stock</p><div class="pc-toast__actions"><button class="button pc-tbtn" data-size="sm" type="button">Undo</button><button class="button pc-tbtn" data-size="sm" type="button">Change</button></div></div><button aria-label="Dismiss" class="icon-button pc-tclose" type="button"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true" class="ph-icon"><path d="M208.49,191.51a12,12,0,0,1-17,17L128,145,64.49,208.49a12,12,0,0,1-17-17L111,128,47.51,64.49a12,12,0,0,1,17-17L128,111l63.51-63.52a12,12,0,0,1,17,17L145,128Z"></path></svg></button></div></div></div></body></html>
