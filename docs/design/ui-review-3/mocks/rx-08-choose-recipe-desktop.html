<style data-proposed>
/* ===== Round 1 shared rules (same as the PC mocks' RULES_CSS; owners: DS for Button/IconButton/BottomSheet, A11Y for the ring) ===== */
/* R-A Buttons look like buttons: a secondary button has a fill AND a 1 px --color-outline boundary on every surface; on a tinted tile its fill is --color-surface. */
.button[data-variant="secondary"]{background:var(--color-surface);box-shadow:inset 0 0 0 1px var(--color-outline)}
.tile[data-variant="status"] .icon-button,.step-card .icon-button,.rx-outline{background:var(--color-surface);box-shadow:inset 0 0 0 1px var(--color-outline)}
.sheet .button[data-variant="secondary"],.dialog .button[data-variant="secondary"],.popover .button[data-variant="secondary"]{background:var(--color-surface)}
/* R-B Close: one circular outline icon button, 40 px, never stretched, top-aligned with the title. */
.rx-close{flex:none;align-self:flex-start;inline-size:40px;block-size:40px;min-inline-size:40px;border-radius:999px;background:transparent;box-shadow:inset 0 0 0 1px var(--color-outline);color:var(--color-text)}
.sheet__header{align-items:flex-start}
/* R-C Focus rings never clipped: scroll containers holding controls keep 5 px of room. */
.sheet__body{padding-block:5px;scroll-padding-block:5px}
.rx-focus,[data-focus="true"]{outline:3px solid var(--color-accent);outline-offset:2px}
/* ===== Round 2 shared rules (same as the PC mocks) ===== */
/* R-C+ Nested focus rings: a control inside a container with its own boundary (a chip with a remove button, a Step card, a line) draws its ring INSIDE itself on a soft fill; the container's accent boundary steps back. */
.rx-nested[data-focus]{outline:2px solid var(--color-accent)!important;outline-offset:-2px!important;background:var(--color-soft)!important;border-radius:999px}
.sortable-handle.rx-nested[data-focus]{border-radius:var(--radius-thumb)}
.icon-button.rx-nested[data-focus]{border-radius:var(--radius-control)}
/* R-E Structured rows: key body-strong, state at the end (body-strong, tabular), detail muted under the key; 1 px separators. */
.rx-srows{list-style:none;margin:0;padding:0;display:grid}
.rx-srow{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:var(--space-3);row-gap:2px;padding-block:var(--space-2);border-top:1px solid color-mix(in srgb,currentColor 18%,transparent);align-items:baseline}
.rx-srow:first-child{border-top:0}
.rx-srows dt,.rx-srows dd,.rx-srow dt,.rx-srow dd{margin:0}
.rx-srow__key{font-size:var(--text-body-strong-size);line-height:var(--text-body-strong-line);font-weight:700;color:var(--color-text);min-width:0}
.rx-srow__state{font-size:var(--text-body-strong-size);line-height:var(--text-body-strong-line);font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.rx-srow__detail{grid-column:1;font-size:var(--text-meta-size);line-height:var(--text-meta-line);color:var(--color-muted);font-variant-numeric:tabular-nums}
/* R-F Bottom bar under 360 px: icons only; the current-page highlight and Scan are 40 px squircles centred in their track, inside the bar. */
@media (width < 22.5em){
  .bottom-bar{left:calc(var(--space-1) + env(safe-area-inset-left,0px));right:calc(var(--space-1) + env(safe-area-inset-right,0px));column-gap:0;padding-inline:6px}
  .bottom-bar__label{position:absolute;inline-size:1px;block-size:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  .bottom-bar__link{min-width:0;inline-size:40px;block-size:40px;justify-self:center;border-radius:12px;gap:0}
  .bottom-bar__link[data-accent="true"]{inline-size:40px;block-size:40px;border-radius:12px;box-shadow:none}
}
/* Round 1 taste: a Segmented option never wraps. */
.segmented__option{white-space:nowrap}


.rx-import { display: flex; flex-direction: column; gap: var(--space-4); }
.rx-import h2 { margin: 0; }
.rx-meta { margin: 0; font-size: var(--text-meta-size); line-height: var(--text-meta-line); color: var(--color-muted); }
.rx-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: var(--space-2) var(--space-3); }
/* Phone: Next question is icon-only (named "Next question") so the bar stays one row. */
@media (max-width: 599px) { .rx-hide-phone { display: none; } .rx-next { inline-size: 44px; padding: 0; justify-content: center; } .rx-next svg { inline-size: 20px; block-size: 20px; } }
.rx-bar { flex-wrap: nowrap; }
.rx-bar__note { margin-inline-end: auto; font-size: var(--text-meta-size); line-height: var(--text-meta-line); color: var(--color-muted); }
.rx-row__footer, .rx-row__panel { flex-basis: 100%; }
.rx-row { flex-wrap: wrap; }
.rx-row__footer { display: flex; flex-wrap: wrap; gap: var(--space-2); padding-inline-start: calc(40px + var(--space-3)); padding-block-end: var(--space-3); }
.rx-tile-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); }
.rx-scrim { position: fixed; inset: 0; background: color-mix(in oklab, #000 40%, transparent); z-index: 20; } dialog.sheet[open] { z-index: 21; }
</style>
