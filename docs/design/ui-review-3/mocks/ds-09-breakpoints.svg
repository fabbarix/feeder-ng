<text x="1238.7" y="268" class="n">desktop</text>
<text x="1238.7" y="286" class="m">1536 px</text>
<line x1="40" x2="1360.0" y1="296" y2="296" class="ax"/><line x1="40.0" x2="40.0" y1="296" y2="302" class="ax"/><text x="40.0" y="316" class="t" text-anchor="middle">0</text><line x1="195.3" x2="195.3" y1="296" y2="302" class="ax"/><text x="195.3" y="316" class="t" text-anchor="middle">200</text><line x1="350.6" x2="350.6" y1="296" y2="302" class="ax"/><text x="350.6" y="316" class="t" text-anchor="middle">400</text><line x1="505.9" x2="505.9" y1="296" y2="302" class="ax"/><text x="505.9" y="316" class="t" text-anchor="middle">600</text><line x1="661.2" x2="661.2" y1="296" y2="302" class="ax"/><text x="661.2" y="316" class="t" text-anchor="middle">800</text><line x1="816.5" x2="816.5" y1="296" y2="302" class="ax"/><text x="816.5" y="316" class="t" text-anchor="middle">1000</text><line x1="971.8" x2="971.8" y1="296" y2="302" class="ax"/><text x="971.8" y="316" class="t" text-anchor="middle">1200</text><line x1="1127.1" x2="1127.1" y1="296" y2="302" class="ax"/><text x="1127.1" y="316" class="t" text-anchor="middle">1400</text><line x1="1282.4" x2="1282.4" y1="296" y2="302" class="ax"/><text x="1282.4" y="316" class="t" text-anchor="middle">1600</text><text x="1360.0" y="334" class="t" text-anchor="end">viewport width, CSS px</text>
<rect x="40" y="337" width="14" height="14" fill="#cfe3d6"/><text x="62" y="350" class="l"><tspan class="b">narrow</tspan>  width &lt; 22.5em (below 360 px at 16 px text) — bottom bar icons only · PageHeader secondary icon-only · FilterBar view row wraps</text><rect x="40" y="361" width="14" height="14" fill="#b9d9c4"/><text x="62" y="374" class="l"><tspan class="b">phone</tspan>  min-width: 22.5em (360 px at 16 px text) — phone portrait, bottom bar with labels, sheets from the bottom</text><rect x="40" y="385" width="14" height="14" fill="#a3cfb2"/><text x="62" y="398" class="l"><tspan class="b">tablet</tspan>  min-width: 37.5em (600 px at 16 px text) — two-up form tiles, FormActions inline, board wall</text><rect x="40" y="409" width="14" height="14" fill="#8dc5a0"/><text x="62" y="422" class="l"><tspan class="b">md</tspan>  min-width: 48em (768 px at 16 px text) — sheets become centred dialogs · Menu and Select become popovers · Cook Mode tap zones</text><rect x="40" y="433" width="14" height="14" fill="#77bb8e"/><text x="62" y="446" class="l"><tspan class="b">desktop</tspan>  min-width: 64em (1024 px at 16 px text) — the rail replaces the bottom bar (88 px)</text><rect x="40" y="457" width="14" height="14" fill="#61b17c"/><text x="62" y="470" class="l"><tspan class="b">desktop-wide</tspan>  min-width: 80em (1280 px at 16 px text) — two-column details (Recipe, Pantry) · gutter 32 · bento gap 16</text><rect x="40" y="481" width="14" height="14" fill="#4ba76a"/><text x="62" y="494" class="l"><tspan class="b">wide</tspan>  min-width: 90em (1440 px at 16 px text) — the rail expands to 240 px with labels</text>
<text x="40" y="530" class="t">Component-fit thresholds (ingredient lines 900, ms-card split 820, hero actions 820, shop chips 420, Shelf Life tiles 560) move to container queries in rem on their own container.</text>
</svg>