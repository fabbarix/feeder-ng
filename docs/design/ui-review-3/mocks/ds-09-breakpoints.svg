<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 540" role="img" aria-labelledby="t d">
<title id="t">DS-09 breakpoint table</title><desc id="d">Seven named width bands written in em, so they move with the browser text size: at 16 px text and at 24 px text.</desc>
<style>.h{font:800 15px Figtree,system-ui,sans-serif;fill:#131d17}.n{font:800 13px Figtree,system-ui,sans-serif;fill:#0d2617}.m{font:600 11px Figtree,system-ui,sans-serif;fill:#0d2617}.t{font:500 11px Figtree,system-ui,sans-serif;fill:#4b5a4f}.l{font:500 13px Figtree,system-ui,sans-serif;fill:#131d17}.b{font-weight:800}.ax{stroke:#677a6d}.band{stroke:#fafffc;stroke-width:1}</style>
<rect width="1400" height="540" fill="#fafffc"/>
<text x="40" y="30" class="h">One breakpoint table: min-width only, written in em (viewport px shown at the browser text size)</text>
<text x="40" y="70" class="h">Default browser text size (16 px)</text>
<rect x="40.0" y="80" width="279.5" height="44" fill="#cfe3d6" class="band"/>
<text x="46.0" y="98" class="n">narrow</text>
<rect x="319.5" y="80" width="186.4" height="44" fill="#b9d9c4" class="band"/>
<text x="325.5" y="98" class="n">phone</text>
<text x="325.5" y="116" class="m">360 px</text>
<rect x="505.9" y="80" width="130.4" height="44" fill="#a3cfb2" class="band"/>
<text x="511.9" y="98" class="n">tablet</text>
<text x="511.9" y="116" class="m">600 px</text>
<rect x="636.3" y="80" width="198.8" height="44" fill="#8dc5a0" class="band"/>
<text x="642.3" y="98" class="n">md</text>
<text x="642.3" y="116" class="m">768 px</text>
<rect x="835.1" y="80" width="198.8" height="44" fill="#77bb8e" class="band"/>
<text x="841.1" y="98" class="n">desktop</text>
<text x="841.1" y="116" class="m">1024 px</text>
<rect x="1033.9" y="80" width="124.2" height="44" fill="#61b17c" class="band"/>
<text x="1039.9" y="98" class="n">desktop-wide</text>
<text x="1039.9" y="116" class="m">1280 px</text>
<rect x="1158.1" y="80" width="201.9" height="44" fill="#4ba76a" class="band"/>
<text x="1164.1" y="98" class="n">wide</text>
<text x="1164.1" y="116" class="m">1440 px</text>
<text x="40" y="160" class="h">Browser text size 20 px: every band starts 1.25× later</text>
<rect x="40.0" y="170" width="349.4" height="44" fill="#cfe3d6" class="band"/>
<text x="46.0" y="188" class="n">narrow</text>
<rect x="389.4" y="170" width="232.9" height="44" fill="#b9d9c4" class="band"/>
<text x="395.4" y="188" class="n">phone</text>
<text x="395.4" y="206" class="m">450 px</text>
<rect x="622.4" y="170" width="163.1" height="44" fill="#a3cfb2" class="band"/>
<text x="628.4" y="188" class="n">tablet</text>
<text x="628.4" y="206" class="m">750 px</text>
<rect x="785.4" y="170" width="248.5" height="44" fill="#8dc5a0" class="band"/>
<text x="791.4" y="188" class="n">md</text>
<text x="791.4" y="206" class="m">960 px</text>
<rect x="1033.9" y="170" width="248.5" height="44" fill="#77bb8e" class="band"/>
<text x="1039.9" y="188" class="n">desktop</text>
<text x="1039.9" y="206" class="m">1280 px</text>
<rect x="1282.4" y="170" width="77.6" height="44" fill="#61b17c" class="band"/>
<text x="1288.4" y="188" class="n">desktop-wide</text>
<text x="1288.4" y="206" class="m">1600 px</text>
<text x="40" y="240" class="h">Browser text size 24 px: every band starts 1.5× later</text>
<rect x="40.0" y="250" width="419.3" height="44" fill="#cfe3d6" class="band"/>
<text x="46.0" y="268" class="n">narrow</text>
<rect x="459.3" y="250" width="279.5" height="44" fill="#b9d9c4" class="band"/>
<text x="465.3" y="268" class="n">phone</text>
<text x="465.3" y="286" class="m">540 px</text>
<rect x="738.8" y="250" width="195.7" height="44" fill="#a3cfb2" class="band"/>
<text x="744.8" y="268" class="n">tablet</text>
<text x="744.8" y="286" class="m">900 px</text>
<rect x="934.5" y="250" width="298.2" height="44" fill="#8dc5a0" class="band"/>
