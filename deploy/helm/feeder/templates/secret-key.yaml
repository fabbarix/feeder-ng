{{- include "feeder.secretKeyGuard" . }}
{{- $sk := include "feeder.secretKey" . | fromJson }}
{{- if and $sk.generate (not $sk.existingSecret) }}
{{- $name := include "feeder.secretKeySecretName" . }}
{{- /* Keep the key across upgrades and reinstalls: reuse the Secret when the cluster already has it (lookup is empty under helm template). */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $old := "" }}
{{- if $existing }}{{ $old = index ($existing.data | default dict) $sk.key | default "" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "feeder.labels" . | nindent 4 }}
  annotations:
    # Keep the key when the release is uninstalled: it encrypts data in the database on the kept volume.
    helm.sh/resource-policy: keep
type: Opaque
{{- if $old }}
data:
  {{ $sk.key | quote }}: {{ $old | quote }}
{{- else }}
stringData:
  # randBytes already returns base64 (32 bytes, 44 characters): do not b64enc it.
  {{ $sk.key | quote }}: {{ randBytes 32 | quote }}
{{- end }}
{{- end }}
