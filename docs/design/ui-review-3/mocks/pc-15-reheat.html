<!doctype html>

<title>Reheat</title>
<!-- UI review 3, theme PC (planning the week and cooking). Mock: PC-15 Reheat: a stepper, one primary
     Theme variables are what the app sets inline on <html>; switch with data-scheme="dark". -->
<link rel="stylesheet" href="app.css">
<style data-theme-vars>
html[data-scheme="light"]{--color-bg: #e7f4eb; --color-surface: #fafffc; --color-surface-2: #daecdf; --color-surface-3: #c8e0cf; --color-line: #c2d7c9; --color-outline: #677a6d; --color-text: #131d17; --color-muted: #4b5a4f; --color-accent: #34724e; --color-on-accent: #ffffff; --color-accent-text: #135533; --color-soft: #bfebcd; --color-soft-strong: #9addb2; --color-background: #e7f4eb; --color-on-background: #131d17; --color-surface-container-low: #fafffc; --color-surface-container: #daecdf; --color-surface-container-high: #c8e0cf; --color-on-surface: #131d17; --color-on-surface-variant: #4b5a4f; --color-primary: #34724e; --color-on-primary: #ffffff; --color-primary-container: #bfebcd; --color-on-primary-container: #135533; --color-secondary: #34724e; --color-on-secondary: #ffffff; --color-secondary-container: #bfebcd; --color-on-secondary-container: #135533; --status-leftover-fg: #065353; --status-leftover-bg: #c2f3f2; --status-leftover-solid: #027879; --status-spoil-fg: #6d3706; --status-spoil-bg: #fee1cf; --status-spoil-solid: #9e5106; --status-danger-fg: #742e2b; --status-danger-bg: #ffe0dc; --status-danger-solid: #ab413e; --status-success-fg: #115629; --status-success-bg: #d1f2d7; --status-success-solid: #0a7e3a; --status-pinned-fg: #3e3f7c; --status-pinned-bg: #e3e6fe; --status-pinned-solid: #5b5cb7; ;color-scheme:light}
html[data-scheme="dark"]{--color-bg: #090f0b; --color-surface: #131c16; --color-surface-2: #1e2a22; --color-surface-3: #28372d; --color-line: #303f35; --color-outline: #788c7f; --color-text: #e9f1ec; --color-muted: #aebbb2; --color-accent: #89c8a0; --color-on-accent: #051b0e; --color-accent-text: #a2e3b9; --color-soft: #143c25; --color-soft-strong: #144f30; --color-background: #090f0b; --color-on-background: #e9f1ec; --color-surface-container-low: #131c16; --color-surface-container: #1e2a22; --color-surface-container-high: #28372d; --color-on-surface: #e9f1ec; --color-on-surface-variant: #aebbb2; --color-primary: #89c8a0; --color-on-primary: #051b0e; --color-primary-container: #143c25; --color-on-primary-container: #a2e3b9; --color-secondary: #89c8a0; --color-on-secondary: #051b0e; --color-secondary-container: #143c25; --color-on-secondary-container: #a2e3b9; --status-leftover-fg: #85e4e3; --status-leftover-bg: #043535; --status-leftover-solid: #027879; --status-spoil-fg: #fec39b; --status-spoil-bg: #44250c; --status-spoil-solid: #9e5106; --status-danger-fg: #febfb9; --status-danger-bg: #47211e; --status-danger-solid: #ab413e; --status-success-fg: #a7e2b2; --status-success-bg: #14361d; --status-success-solid: #0a7e3a; --status-pinned-fg: #c7cdff; --status-pinned-bg: #282a4b; --status-pinned-solid: #5b5cb7; ;color-scheme:dark}
html{background:var(--color-bg)} body{margin:0;background:var(--color-bg);color:var(--color-text)}
.mock-scrim{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:40}
.mock-scrim + dialog{z-index:41}
</style>
<style data-proposed>

/* DS-12 IconButton: a 1 px --color-outline boundary on every surface; fill surface-2 on surface, --color-surface on a tinted
   tile (status or soft); on the light accent hero the fill is the boundary. Specific outline buttons below override it. */
.icon-button{box-shadow:inset 0 0 0 1px var(--color-outline)}
.tile[data-variant="soft"] .icon-button{background:var(--color-surface)}
html[data-scheme="light"] .tile[data-variant="hero"] .icon-button{box-shadow:none}
/* R-A Buttons look like buttons. A secondary button has a fill AND a 1 px --color-outline boundary on every surface
   (outline vs surface 4.5 / 4.9, vs status tints 3.7-4.0 light and dark). On a tinted tile (status, soft) its fill is --color-surface.
   Tertiary (bare text) buttons are not used as actions in tiles, notices, toasts or sheet footers. */
.button[data-variant="secondary"]{background:var(--color-surface);box-shadow:inset 0 0 0 1px var(--color-outline)}
.tile[data-variant="status"] .icon-button,.pc-lo .icon-button,.pc-alert .icon-button{background:var(--color-surface);box-shadow:inset 0 0 0 1px var(--color-outline)}
.sheet .button[data-variant="secondary"],.dialog .button[data-variant="secondary"]{background:var(--color-surface)}
.button[data-variant="danger-tertiary"]{background:var(--color-surface);box-shadow:inset 0 0 0 1px var(--status-danger-fg);color:var(--status-danger-fg)}
/* R-B Close: one circular outline icon button, 40 px (52 px target through the existing ::after), never stretched; top-aligned with the title. */
.pc-close{flex:none;align-self:flex-start;inline-size:40px;block-size:40px;border-radius:999px;background:transparent;box-shadow:inset 0 0 0 1px var(--color-outline);color:var(--color-text)}
.sheet__header{align-items:flex-start}
/* R-C Focus rings are never clipped: every scroll container that holds controls keeps 5 px of room (3 px ring + 2 px offset);
   nested controls are inset inside their container's padding; sticky bars set scroll-padding so a focused control is never under them. */
.sheet__body{padding-block:5px;scroll-padding-block:5px}
.pc-focus{outline:3px solid var(--color-accent);outline-offset:2px}
.toast .pc-focus,.toast :focus-visible{outline-color:var(--color-bg)}
/* R-D A toast with detail: icon | headline (body-strong), muted subline (meta), optional body (body), actions as real outline buttons; Dismiss top-right. */
.toast{align-items:center}
.toast .toast__message{flex:1 1 auto;min-width:0}
.pc-toast-rich{align-items:flex-start;padding:14px 10px 14px 18px}
/* R-D+: the status icon (16 px) is part of the headline line, centred on its text; a success toast has none */
.pc-toast__head{display:flex;align-items:center;gap:var(--space-2)}
.pc-toast__icon{display:inline-grid;place-items:center;flex:none;block-size:var(--text-body-strong-line)}
.toast[data-status="error"] .pc-toast__icon{color:var(--status-danger-bg)}
.pc-toast__text{flex:1 1 auto;min-width:0;display:grid;gap:2px}
.pc-toast__text p{margin:0}
.pc-toast__head{font-size:var(--text-body-strong-size);line-height:var(--text-body-strong-line);font-weight:700}
.pc-toast__sub{font-size:var(--text-meta-size);line-height:var(--text-meta-line);color:color-mix(in srgb,var(--color-bg) 72%,var(--color-text))}
.pc-toast__body{font-size:var(--text-body-size);line-height:var(--text-body-line);margin-top:4px!important}
.pc-toast__actions{display:flex;gap:var(--space-2);margin-top:var(--space-2)}
.pc-tbtn{flex:none;min-block-size:40px;padding-inline:var(--space-4);border-radius:999px;background:transparent;color:var(--color-bg);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--color-bg) 70%,transparent);font-weight:700}
.pc-toast-rich .pc-tclose{align-self:flex-start}
.pc-tclose{flex:none;inline-size:32px;block-size:32px;border-radius:999px;background:transparent;color:var(--color-bg);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--color-bg) 55%,transparent)}
/* R-C+ Nested focus rings: a control inside a container that has its own visible boundary (a timer pill, a status tile, a
   rail timer tile, a chip with a remove button) draws its ring INSIDE itself: 2 px --color-accent at outline-offset -2 px on a
   --color-soft fill. While a child has focus, a container whose boundary is accent-coloured steps it back to its neutral 1 px
   --color-outline, so only one accent ring is ever visible; at least 4 px of fill always separates the two lines. */
.pc-nested:focus-visible,.pc-nested[data-focus]{outline:2px solid var(--color-accent);outline-offset:-2px;background:var(--color-soft)}
/* R-E Structured rows, not bullet lists: an item with a key, a state and detail is a row - key body-strong, state at the end
   (body-strong, tabular figures, status colour), detail under the key in meta, muted; rows separated by 1 px --color-line. */
.pc-srows{list-style:none;margin:0;padding:0;display:grid}
.pc-srow{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:var(--space-3);row-gap:2px;padding-block:var(--space-2);border-top:1px solid color-mix(in srgb,currentColor 18%,transparent)}
.pc-srow:first-child{border-top:0}
.pc-srow__key{font-size:var(--text-body-strong-size);line-height:var(--text-body-strong-line);font-weight:700;color:var(--color-text)}
.pc-srow__state{font-size:var(--text-body-strong-size);line-height:var(--text-body-strong-line);font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.pc-srow__detail{grid-column:1/-1;font-size:var(--text-meta-size);line-height:var(--text-meta-line);color:var(--color-muted);font-variant-numeric:tabular-nums}
/* R-F Bottom bar under 360 px (DS-02, decision DS 1): icon only; the current-page highlight and Scan are 44 px squircles
   (equal width and height) centred in their track, fully inside the bar. At 320 the bar is 312 px with 6 px inline padding, so a
   track is 42.9 px: the squircles are 40 px (radius 12 px), leaving at least 7 px to the bar's edge; the whole track (43 x 64 px)
   stays the tap target. */
@media (width < 22.5em){
  .bottom-bar{left:calc(var(--space-1) + env(safe-area-inset-left,0px));right:calc(var(--space-1) + env(safe-area-inset-right,0px));column-gap:0;padding-inline:6px}
  .bottom-bar__label{position:absolute;inline-size:1px;block-size:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  .bottom-bar__link{min-width:0;inline-size:40px;block-size:40px;justify-self:center;border-radius:12px;gap:0}
  .bottom-bar__link[data-accent="true"]{inline-size:40px;block-size:40px;border-radius:12px;box-shadow:none}
}
/* below-slot chips line up with the row text when the row has a lead picture */
.list-row:has(.list-row__lead) > .list-row__below{padding-inline-start:52px}


/* NEW (PC-10): the context line above a sheet title: "Mon 16 · Dinner · Main". Type role meta, muted. */
.pc-sheet-head{display:grid;gap:2px;min-width:0}
.pc-context{margin:0;font-size:var(--text-meta-size);line-height:var(--text-meta-line);font-weight:600;color:var(--color-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Provisional warn tone: the final tokens and values are the DS theme's item (warn status). Shown here only so the mock renders. */
html[data-scheme="light"]{--status-warn-fg:#6b4a00;--status-warn-bg:#fdf0c4}
html[data-scheme="dark"]{--status-warn-fg:#f5d27a;--status-warn-bg:#3a2e08}

/* ======== PC-03 Cook Mode layout ======== */
.cook-screen{padding-block-end:0}
/* Step text scales by length (lib/steps stepTextSize): short 30/800 phone, 58/800 tablet+; long (> 25 words) 22/26 phone, 34/38 tablet+ */
/* Step text keeps its size; its weight is Medium (NEW token --text-step-weight: 500, the user's choice) on every size, SHORT-01's landscape Step too */
:root{--text-step-weight:500}
.cook-step__text{overflow-wrap:break-word;font-weight:var(--text-step-weight)}
.cook-step__text[data-length="long"]{font-size:var(--text-title-2-size);line-height:var(--text-title-2-line)}
@media (min-width:768px){.cook-step__text[data-length="long"]{font-size:var(--text-display-size);line-height:var(--text-display-line)}}
/* Step photo: capped; the whole photo opens in a dialog */
.pc-photo{position:relative;margin:0}
.cook-step__image{display:block;max-block-size:min(32dvh,22rem);inline-size:100%;object-fit:cover}
.cook-step .pc-photo{position:relative;display:block}
.cook-step .pc-photo > .icon-button{position:absolute;inset:auto var(--space-2) var(--space-2) auto;background:rgb(0 0 0 / .55);color:#fff}
.cook-top .icon-button{border-radius:999px;background:var(--color-surface);box-shadow:inset 0 0 0 1px var(--color-outline)}
/* On a phone the Ingredients button is icon-only (its name stays "Ingredients"), so the top row is one line at 320 px */
@media (max-width:599px){.pc-hide-phone{display:none}.pc-ingr{inline-size:44px;padding:0;justify-content:center}}
.pc-ingr svg{inline-size:20px;block-size:20px;flex:none}
/* The Step count moves into the Step tile's overline ("Step 2 of 5 · Active · 2 min"); the top row is Exit … Ingredients, Voice */
.cook-top{flex-wrap:nowrap}.pc-spacer{flex:1}
/* Advance Steps: after Step 1 one summary line */
/* DS 3 (decided): Advance Steps use the info tone, here as one bordered line */
.pc-adv-line{display:flex;align-items:center;gap:var(--space-2);margin:0;padding:var(--space-2) var(--space-3);border-radius:var(--radius-tile-sm);background:var(--color-info-bg);border:1px solid var(--color-info-fg);font-size:var(--text-meta-size);line-height:var(--text-meta-line);color:var(--color-info-fg)}
.pc-adv-line strong{color:var(--color-info-fg)}
/* The timer strip: one line of timer pills, sticky above Back/Next (phone and tablet portrait) */
.cook-nav{grid-template-columns:1fr 2fr}
.pc-strip{grid-column:1/-1;display:flex;gap:var(--space-2);overflow-x:auto;scrollbar-width:none;padding-block-end:var(--space-1)}
.pc-tpill{flex:none;display:flex;align-items:center;gap:var(--space-2);min-block-size:52px;max-inline-size:78%;padding:6px 6px 6px var(--space-3);border-radius:999px;background:var(--color-surface);box-shadow:inset 0 0 0 1px var(--color-outline);color:var(--color-text)}
.pc-tpill[data-gate]{box-shadow:inset 0 0 0 2px var(--color-accent)}
/* R-C+: the focused nested control draws its ring inside itself (2 px accent, offset -2 px) on a --color-soft fill, and while a
   child has focus the container's own accent boundary steps back to its neutral 1 px outline: only one accent ring shows. */
.pc-tpill [data-focus]{outline:2px solid var(--color-accent);outline-offset:-2px;background:var(--color-soft);color:var(--color-accent-text)}
.pc-tpill:has([data-focus]),.pc-tpill:has(:focus-visible){box-shadow:inset 0 0 0 1px var(--color-outline)}
.pc-tpill[data-state="finished"]{background:var(--status-success-bg);color:var(--status-success-fg);box-shadow:inset 0 0 0 2px var(--status-success-fg)}
.pc-tpill__label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--text-body-strong-size);font-weight:700}
.pc-tpill__time{font-variant-numeric:tabular-nums;font-weight:800;font-size:var(--text-title-3-size)}
.pc-tpill .icon-button{inline-size:40px;block-size:40px;border-radius:999px;flex:none;background:var(--color-surface-2)}
/* R-C: the strip scrolls sideways, so it keeps 5 px of room for the focus ring of its first and last control */
.pc-strip{padding:5px}
.cook-nav__held{display:flex;gap:var(--space-2);align-items:center}
/* Get ready: the scaled Ingredient list (FLOW-13) */
.pc-ready{display:grid;gap:var(--space-2)}
.pc-ready h2{margin:0;font-size:var(--text-title-3-size);line-height:var(--text-title-3-line)}
.pc-ready__m{margin:0;color:var(--color-muted);font-size:var(--text-meta-size);line-height:var(--text-meta-line)}
.pc-ing{list-style:none;margin:0;padding:0;display:grid}
.pc-ing li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:var(--space-3);align-items:center;min-block-size:52px;padding-block:var(--space-1);border-top:1px solid var(--color-line)}
.pc-ing li:first-child{border-top:0}
.pc-ing__q{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;font-size:var(--text-body-strong-size)}
.pc-ing__n{font-size:var(--text-body-strong-size);line-height:var(--text-body-strong-line);font-weight:700}
.pc-ing__n small{display:block;margin-top:1px;color:var(--color-muted);font-size:var(--text-meta-size);line-height:var(--text-meta-line);font-weight:500}
.pc-check{display:grid;place-items:center;inline-size:22px;block-size:22px;border-radius:6px;border:2px solid var(--color-outline);color:var(--color-on-accent)}
.pc-check[data-on="true"]{background:var(--color-accent);border-color:var(--color-accent)}
.pc-ing li[data-on="true"] .pc-ing__n,.pc-ing li[data-on="true"] .pc-ing__q{color:var(--color-muted)}
.pc-ing li[data-on="true"] .pc-ing__name{text-decoration:line-through}
/* Timer rail and two columns from 1024 px: Step | rail (timers, Get ready) */
.pc-rail{display:none}
@media (min-width:1024px){
  .cook-screen{max-width:1480px;display:grid;grid-template-columns:minmax(0,1fr) 22rem;grid-template-rows:auto auto auto 1fr auto;column-gap:var(--space-6);align-items:start}
  .cook-screen > :not(.pc-rail){grid-column:1}
  .pc-rail{display:grid;gap:var(--space-4);grid-column:2;grid-row:1 / -1;position:sticky;top:var(--space-4);align-self:start;max-block-size:calc(100dvh - 2*var(--space-4));overflow:auto}
  .pc-strip{display:none}
  .cook-step__image{max-block-size:min(40dvh,26rem)}
}
.pc-rail h2{margin:0;font-size:var(--text-label-size);line-height:var(--text-label-line)}
.pc-timer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-1) var(--space-2);align-items:center}
.pc-timer__label{margin:0;font-size:var(--text-body-strong-size);line-height:var(--text-body-strong-line);font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc-timer__place{margin:0;grid-column:1;font-size:var(--text-meta-size);color:var(--color-muted)}
.pc-timer__time{grid-column:1;font-size:var(--text-display-size);line-height:var(--text-display-line);font-weight:800;font-variant-numeric:tabular-nums}
.pc-timer__ctl{grid-column:2;grid-row:1 / span 3;display:grid;gap:var(--space-2)}
.pc-timer__ctl .icon-button{inline-size:44px;block-size:44px;border-radius:999px;background:var(--color-surface);box-shadow:inset 0 0 0 1px var(--color-outline)}
.pc-timer[data-gate] .pc-timer__time{color:var(--color-accent-text)}
.pc-timer__ctl [data-focus]{outline:2px solid var(--color-accent);outline-offset:-2px;background:var(--color-soft);color:var(--color-accent-text)}

/* PC-15: the Reheat time is one stepper (− 4:00 +), Start timer is the one primary; Mark as Cooked is secondary (primary once the timer ends) */
.pc-rh-name{margin:0;font-size:var(--text-title-2-size);line-height:var(--text-title-2-line);font-weight:800}
.pc-rh-m{margin:0;color:var(--color-muted)}
.pc-rh-stepper{display:grid;grid-template-columns:56px minmax(0,1fr) 56px;align-items:center;justify-items:center;gap:var(--space-2)}
.pc-rh-stepper .icon-button{inline-size:56px;block-size:56px}
.pc-rh-foot{margin-top:auto;padding-block-end:calc(env(safe-area-inset-bottom) + var(--space-3))}

</style>
</head>
<body>
