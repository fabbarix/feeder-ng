<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>pantry sort cut</title>
<!-- pantry-filter review (P22): row 2 of the Pantry header as the author first built it: "By Storage Place | By Ingredient" beside
     the Sort chip, whose value "Good until" shows 7 of its 75 px at 390 px ("G…" on the real build), 57 px at 440 and all at 480. No other rule sees it: the
     cut text is a Select's value, not a .chip label (P16), and nothing overflows (P1, P13). -->
<style>
  body { margin: 0; font: 15px/20px sans-serif }
  main { padding: 0 16px }
  .filter-bar { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px }
  .filter-bar__row { display: flex; flex-wrap: nowrap; align-items: center; gap: 8px; min-inline-size: 0 }
  .filter-bar__search-row > .ui-field { flex: 1 1 auto; min-inline-size: 0 }
  .filter-bar__search-row input { inline-size: 100%; box-sizing: border-box; block-size: 44px }
  .filter-bar__search-row > .button { flex: none; block-size: 36px; padding: 0 12px }
  .filter-bar__view-row { justify-content: space-between }
  .filter-bar__view-row > .ui-field:first-child { flex: none }
  .segmented { display: flex; gap: 4px; padding: 4px; inline-size: max-content; background: #eee; border-radius: 12px }
  .segmented__option { flex: none; padding: 0 12px; min-block-size: 40px; white-space: nowrap; border: 0; font: 700 13px/16px sans-serif }
  .filter-bar__sort { flex: 0 1 auto; min-inline-size: 0 }
  .ui-field { min-inline-size: 0 }
  .select__trigger { display: flex; align-items: center; gap: 8px; max-inline-size: 100%; min-inline-size: 0; block-size: 44px; padding: 0 12px; border-radius: 999px; border: 1px solid #888; background: none; font: 700 15px/20px sans-serif; box-sizing: border-box }
  .select__leading { flex: none; inline-size: 32px; text-align: center }
  .select__value { flex: 1; min-inline-size: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .select__chevron { flex: none; inline-size: 20px }
</style>
<script>const mq = matchMedia('(prefers-color-scheme: dark)'); const set = () => { document.documentElement.dataset.scheme = mq.matches ? 'dark' : 'light' }; set(); mq.addEventListener('change', set)</script></head><body>
<main><div class="page" data-page-width="default"><div class="stock-screen">
  <h1>Pantry</h1>
  <div class="filter-bar">
    <div class="filter-bar__row filter-bar__search-row">
      <div class="ui-field"><input type="search" aria-label="Search Stock" placeholder="Search Stock"></div>
      <button class="button" type="button" aria-label="Filters, 2 active">Filters 2</button>
    </div>
    <div class="filter-bar__row filter-bar__view-row">
      <div class="ui-field"><div class="segmented" role="radiogroup" aria-label="List"><button class="segmented__option" role="radio" aria-checked="true">By Storage Place</button><button class="segmented__option" role="radio" aria-checked="false">By Ingredient</button></div></div>
      <div class="filter-bar__sort"><div class="ui-field"><button class="select__trigger" data-appearance="chip" role="combobox" aria-label="Sort"><span class="select__leading">&#8597;</span><span class="select__value">Good until</span><span class="select__chevron">&#9662;</span></button></div></div>
    </div>
  </div>
  <p>Flour, 500 g</p>
</div></div></main></body></html>
