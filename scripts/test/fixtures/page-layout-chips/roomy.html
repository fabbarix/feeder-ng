<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>roomy chips</title>
<!-- ds-plan round 3: the fixed rule. The chip line is as wide as its row text (inline-size: 100%) and a chip is flex 0 1 auto, so a
     lone chip shows in full (no P14). The second row's line is REALLY full (three long chips in a narrow tile): its last chip is
     cut because there is no room, which is not a finding. -->
<style>
  body { margin: 0; font: 15px/20px sans-serif }
  .page { padding: 0 16px }
  .bento-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(20rem, 100%), 1fr)) }
  .tile { display: grid; grid-template-columns: minmax(0, 1fr); padding: 16px; border: 1px solid #888; border-radius: 20px }
  .row { display: flex; gap: 8px; align-items: flex-start }
  .row__text { min-width: 0; flex: 1 1 auto }
  .row__chips { display: flex; flex-wrap: nowrap; gap: 4px; min-width: 0; overflow: hidden; inline-size: 100% }
  .chip { display: inline-flex; align-items: center; block-size: 26px; padding: 0 10px; border-radius: 999px; background: #eee; white-space: nowrap; flex: 0 1 auto; min-inline-size: 0 }
  .chip__label { min-width: 0; overflow: hidden; text-overflow: ellipsis }
  .narrow { max-inline-size: 18rem }
</style>
<script>const mq = matchMedia('(prefers-color-scheme: dark)'); const set = () => { document.documentElement.dataset.scheme = mq.matches ? 'dark' : 'light' }; set(); mq.addEventListener('change', set)</script></head><body>
<main><div class="page" data-page-width="wide"><h1>Settings</h1><div class="bento-grid">
  <section class="tile"><h2>Sat 14</h2>
    <div class="row"><div class="row__text"><div>Sam's Rotisserie Chicken</div><div class="row__chips"><span class="chip"><span class="chip__label">Leftover from Sat</span></span></div></div><button>⇆</button></div>
  </section>
  <section class="tile narrow"><h2>Sun 15</h2>
    <div class="row"><div class="row__text"><div>Chicken breast in Marsala sauce</div><div class="row__chips"><span class="chip"><span class="chip__label">Leftover from Sun and a very long extra</span></span><span class="chip"><span class="chip__label">Mia and Fabio's favourite, and also Sam's on Sundays</span></span></div></div><button>⇆</button></div>
  </section>
</div></div></main></body></html>
