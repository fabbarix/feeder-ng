<!doctype html>
<html lang="en" data-scheme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="app.css"><title>Danger and textarea</title>
<style data-proposed>
/* ===== A11Y proposal (docs/design/ui-review-3/a11y.md). Lift into the files named in each block. ===== */

/* --- A11Y-02 styles.css :root: one focus ring --- */
:root {
  --focus-ring-width: 3px;
  --focus-ring-offset: 2px;
  /* inside a clipping container (list group, sheet body, scroller) the ring is drawn inside the edge */
  --focus-ring-offset-inset: calc(-1 * var(--focus-ring-width));
  --focus-ring-color: var(--color-accent);
  /* A11Y-06: selected / pressed state */
  --selected-bg: var(--color-soft);
  --selected-fg: var(--color-accent-text);
  --selected-ring: var(--color-accent-text);
  --selected-ring-width: 1.5px;
  /* A11Y-09: targets */
  --target-min: 44px;
  --icon-set-gap: var(--space-2);  /* fine: a 5 px outer ring never reaches the neighbour (8 - 5 = 3 px clear) */
}
@media (pointer: coarse) {
  :root { --icon-set-gap: var(--space-3); }  /* coarse: 32 + 12 = a 44 px pitch */
}

/* styles.css: the one rule (zero specificity, so a primitive that moves the ring to its frame, e.g. a field input, still wins).
   Every primitive drops its own outline / box-shadow ring and inherits this. */
:where(:focus-visible) {
  outline: var(--focus-ring-width) solid var(--focus-ring-color);
  outline-offset: var(--focus-ring-offset);
}


/* Every primitive that sets its own ring today (Button, IconButton, Chip, ChoiceChip, Segmented, Switch, Checkbox, ColorSwatches,
   TagColour, EmojiPicker, RadioCards, Slider, Menu, Breadcrumbs, TextLink, Sortable, FileDrop, ImagePicker, Tile stretch, shop
   tick, WeekdayPicker, PriceKeypad, Stepper, TimeField segment) uses the token instead of var(--color-accent): */
.button:focus-visible, .icon-button:focus-visible, button.chip:focus-visible, .segmented__option:focus-visible,
.switch:focus-visible, .colour-swatch:focus-visible, .tile__stretch:focus-visible, .menu__item:focus-visible,
.line-row__tick:focus-visible, .shop-not-needed__toggle:focus-visible, .weekday-picker__chip:focus-visible,
.price-keypad__key:focus-visible, .price-keypad__display:focus-visible, .stepper__value:focus-visible {
  outline: var(--focus-ring-width) solid var(--focus-ring-color);
  outline-offset: var(--focus-ring-offset);
  box-shadow: none;
}
.choice-chip:focus-visible, .checkbox__input:focus-visible + .checkbox__box {
  outline: var(--focus-ring-width) solid var(--focus-ring-color);
}

/* ui/Tile.css: on an accent-filled container the ring is the on-accent colour (white in light, dark ink in dark). */
.tile[data-variant='hero'] { --focus-ring-color: var(--color-on-accent); }
/* --- A11Y-03 features/plan/components/TonightHero.css: key the dark hero on the chosen scheme (data-scheme, set by
   ThemeProvider for Light, Dark and System alike), never on the OS media query or the unused data-theme attribute. --- */
[data-scheme='dark'] .tile.plan-hero {
  background: var(--color-soft-strong);
  color: var(--color-text);
  /* the dark Today hero is soft-strong, so the accent ring comes back */
  --focus-ring-color: var(--color-accent);
}
[data-scheme='dark'] .tile.plan-hero .button[data-variant='primary'] {
  background: var(--color-accent);
  color: var(--color-on-accent);
}
[data-scheme='dark'] .plan-hero .plan-course__caption {
  color: color-mix(in srgb, var(--color-text) 85%, transparent);
}

/* Fields: the ring is an outline on the frame (survives forced colours), never a box-shadow. The frame rings only while its
   text entry has focus; a button inside the frame (stepper -/+, Clear search) is a nested control (R-C+ below). */
.ui-field__control:has(:is(input, textarea, [role='spinbutton']):focus),
.search-field__control:has(input:focus) {
  border-color: var(--color-accent);
  box-shadow: none;
  outline: var(--focus-ring-width) solid var(--focus-ring-color);
  outline-offset: 0;
}
.select__trigger:focus-visible,
.date-field__trigger:focus-visible {
  border-color: var(--color-accent);
  box-shadow: none;
  outline: var(--focus-ring-width) solid var(--focus-ring-color);
  outline-offset: 0;
}

/* ui/ListRow.css: the row ring sits inside the row and clears the content by 2 px. */
.list-row__target:focus-visible {
  outline: var(--focus-ring-width) solid var(--focus-ring-color);
  outline-offset: var(--focus-ring-offset-inset);
  border-radius: var(--radius-thumb);
}

/* --- A11Y-05 (decided: option B): the Search field and the Segmented track are a stronger fill with a 2 px bottom rule.
   Tokens go in ui/fields/Field.css :root next to --field-border-width. Bordered fields (TextField, Select, ...) keep their outline. --- */
:root {
  --field-fill-strong: var(--color-surface-3);
  --field-rule-width: 2px;
  --field-rule-color: var(--color-outline);
  --field-radius-ruled: var(--radius-control) var(--radius-control) var(--space-1) var(--space-1);
}
.search-field__control,
.segmented {
  background: var(--field-fill-strong);
  border: 0;
  border-block-end: var(--field-rule-width) solid var(--field-rule-color);
  border-radius: var(--field-radius-ruled);
}
.search-field__control:hover,
.segmented:not([data-disabled]):hover {
  background: color-mix(in oklab, var(--field-fill-strong), var(--color-text) 6%);
}
/* focus: the A11Y-02 ring goes round the whole shape; the rule turns accent under it */
.search-field__control:has(input:focus) { border-block-end-color: var(--color-accent); }
/* disabled: no fill, the rule in --color-line (exempt from 1.4.11), text muted */
.segmented[data-disabled],
.search-field__control:has(:disabled) {
  background: transparent;
  border: 0;
  border-block-end: var(--field-rule-width) solid var(--color-line);
  color: var(--color-muted);
}
.segmented[data-disabled] .segmented__option[aria-checked='true'] {
  background: transparent; color: var(--color-text);
  box-shadow: inset 0 0 0 var(--field-border-width) var(--color-outline);
}

/* --- A11Y-06: selected / pressed (Segmented option, ChoiceChip, toggle IconButton) --- */
.segmented__option[aria-checked='true'] {
  background: var(--selected-bg);
  color: var(--selected-fg);
  box-shadow: inset 0 0 0 var(--selected-ring-width) var(--selected-ring);
}
.segmented__check { flex: none; }
.segmented__option { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-1); }
.icon-button[aria-pressed='true'],
.choice-chip[aria-pressed='true'] {
  background: var(--selected-bg);
  color: var(--selected-fg);
  border-color: var(--selected-ring);
  box-shadow: inset 0 0 0 var(--selected-ring-width) var(--selected-ring);
}

/* --- A11Y-09: targets on a coarse pointer --- */
/* new ui/IconSet primitive (system.md §5.5 "one icon set"); until it lands, the three Plan containers: */
.icon-set, .plan-row__actions, .plan-slot-head__actions, .plan-course__actions { gap: var(--icon-set-gap); }
@media (pointer: coarse) {
  .segmented__option { position: relative; }
  .segmented__option::after { content: ''; position: absolute; inset: calc(-1 * var(--space-1)) calc(-0.5 * var(--space-1)); }
  .your-menu-button, .colour-swatch, .switch { position: relative; }
  .your-menu-button::after, .colour-swatch::after { content: ''; position: absolute; inset: -2px; }
  .switch::after { content: ''; position: absolute; inset: -6px 0; }
}

/* --- A11Y-10: skip link (app/shell.css) --- */
.skip-link {
  position: fixed;
  inset-block-start: var(--space-2);
  inset-inline-start: var(--space-2);
  z-index: 100;
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-button);
  background: var(--color-accent);
  color: var(--color-on-accent);
  font-size: var(--text-body-strong-size);
  font-weight: var(--text-body-strong-weight);
  text-decoration: none;
  transform: translateY(calc(-100% - var(--space-4)));
}
.skip-link:focus-visible {
  transform: none;
  --focus-ring-color: var(--color-text);
}
@media (prefers-reduced-motion: no-preference) {
  .skip-link { transition: transform var(--dur-1) var(--ease-out); }
}

/* --- A11Y-04: forced colours (new file ui/forcedColors.css, imported last by ui/index.ts) --- */
@media (forced-colors: active) {
  .button, .icon-button, .chip, .choice-chip, .your-menu-button, .line-row__tick,
  .search-field__control, .segmented, .stepper__value, .price-keypad__key {
    border: 1px solid ButtonText;
  }
  /* the ruled shape keeps its 2 px bottom rule on top of the 1 px frame */
  .search-field__control, .segmented { border-block-end: var(--field-rule-width) solid ButtonText; }
  .tile, .list-group, .bottom-bar, .toast { border: 1px solid CanvasText; }
  .segmented__option[aria-checked='true'],
  .icon-button[aria-pressed='true'],
  .choice-chip[aria-pressed='true'],
  .chip[aria-pressed='true'],
  .checkbox__box[data-state='checked'],
  .checkbox__box[data-state='mixed'],
  .switch[aria-checked='true'] {
    /* !important is allowed in this layer only: it must beat every variant rule (e.g. the filter chip's accent fill) */
    forced-color-adjust: none !important;
    background: Highlight !important;
    color: HighlightText !important;
    border-color: Highlight !important;
  }
  .colour-swatch { forced-color-adjust: none; border: 1px solid CanvasText; }
  .colour-swatch[aria-checked='true'] { box-shadow: none; outline: 3px solid Highlight; outline-offset: 3px; }
  .bottom-bar__link[aria-current='page'],
  .side-rail__link[aria-current='page'] .side-rail__pill {
    forced-color-adjust: none;
    background: Highlight;
    color: HighlightText;
  }
  .switch { border: 1px solid ButtonText; }
  .switch__thumb { forced-color-adjust: none; background: ButtonText; }
  .switch[aria-checked='true'] .switch__thumb { background: HighlightText; }
  :disabled, [aria-disabled='true'] { color: GrayText; border-color: GrayText; opacity: 1; }
  :focus-visible,
  .ui-field__control:has(:is(input, textarea, [role='spinbutton']):focus),
  .search-field__control:has(input:focus) { outline-color: Highlight; }
  .picker-row:focus-visible { outline: var(--focus-ring-width) solid Highlight; outline-offset: var(--focus-ring-offset-inset); }
}

/* --- A11Y-06 round 1: a Segmented option never wraps; under 18 rem of field width the Check is dropped (the ring still marks the choice) --- */
.ui-field:has(> .segmented:not([data-compact])) { container-type: inline-size; }
.segmented__option { flex: 1 1 auto; white-space: nowrap; }
@container (max-width: 18rem) {
  .segmented__check { display: none; }
  .segmented__option { padding-inline: var(--space-2); }
}

/* --- A11Y-02 R-C+ nested focus. A container marked data-focus-scope (field frames, timer pills, rail timer tiles, any pill
   that holds buttons) keeps its own boundary; a control inside it draws a 2 px ring inside itself on a soft fill, and an
   accent boundary on the container steps back to the neutral outline while a child has focus. One accent ring at a time. --- */
:root { --focus-ring-inner-width: 2px; }
:is(.ui-field__control, .search-field__control, [data-focus-scope]) :is(button, [role='button'], a):focus-visible {
  outline: var(--focus-ring-inner-width) solid var(--focus-ring-color);
  outline-offset: calc(-1 * var(--focus-ring-inner-width));
  background: var(--color-soft);
  color: var(--color-accent-text);
}
[data-focus-scope]:has(:focus-visible) { border-color: var(--color-outline); box-shadow: inset 0 0 0 1px var(--color-outline); }
/* at least 4 px of the container's fill between its boundary and the child: stepper buttons are 36 px in the 48 px frame
   (1.5 px border + 4 px fill + 36 + 4 + 1.5 = 47); the ::after keeps the 44 px target */
.ui-field--stepper .icon-button { inline-size: 36px; block-size: 36px; }
.ui-field--stepper .icon-button::after { inset: -4px; }
/* Segmented: arrows choose (useRovingRadios 'auto'), so the focused option is the chosen one; the ring goes round the whole
   track (outer ring), the option draws none, and nothing nests */
.segmented__option:focus-visible { outline: none; }
.segmented:has(.segmented__option:focus-visible) { outline: var(--focus-ring-width) solid var(--focus-ring-color); outline-offset: var(--focus-ring-offset); }
@media (forced-colors: active) {
  .segmented:has(.segmented__option:focus-visible) { outline-color: Highlight; }
}

/* ===== Round-1 shared rules R-A..R-D (the PC mocks' RULES_CSS, reused) ===== */
/* R-A Buttons look like buttons. A secondary button has a fill AND a 1 px --color-outline boundary on every surface
   (outline vs surface 4.5 / 4.9, vs status tints 3.7-4.0 light and dark). On a tinted tile (status, soft) its fill is --color-surface.
   Tertiary (bare text) buttons are not used as actions in tiles, notices, toasts or sheet footers. */
.button[data-variant="secondary"]{background:var(--color-surface);box-shadow:inset 0 0 0 1px var(--color-outline)}
.tile[data-variant="status"] .icon-button,.pc-lo .icon-button,.pc-alert .icon-button{background:var(--color-surface);box-shadow:inset 0 0 0 1px var(--color-outline)}
.sheet .button[data-variant="secondary"],.dialog .button[data-variant="secondary"]{background:var(--color-surface)}
.button[data-variant="danger-tertiary"]{background:var(--color-surface);box-shadow:inset 0 0 0 1px var(--status-danger-fg);color:var(--status-danger-fg)}
/* R-B Close: one circular outline icon button, 40 px (52 px target through the existing ::after), never stretched; top-aligned with the title. */
.pc-close{flex:none;align-self:flex-start;inline-size:40px;block-size:40px;border-radius:999px;background:transparent;box-shadow:inset 0 0 0 1px var(--color-outline);color:var(--color-text)}
.sheet__header{align-items:flex-start}
/* R-C Focus rings are never clipped: every scroll container that holds controls keeps 5 px of room (3 px ring + 2 px offset);
   nested controls are inset inside their container's padding; sticky bars set scroll-padding so a focused control is never under them. */
.sheet__body{padding-block:5px;scroll-padding-block:5px}
.toast{--focus-ring-color:var(--color-bg)}
/* R-D A toast with detail: icon | headline (body-strong), muted subline (meta), optional body (body), actions as real outline buttons; Dismiss top-right. */
.toast{align-items:center}
.toast .toast__message{flex:1 1 auto;min-width:0}
.pc-toast-rich{align-items:flex-start;padding:14px 10px 14px 16px}
.pc-toast-rich > svg{margin-top:2px;flex:none}
.pc-toast__text{flex:1 1 auto;min-width:0;display:grid;gap:2px}
.pc-toast__text p{margin:0}
.pc-toast__head{font-size:var(--text-body-strong-size);line-height:var(--text-body-strong-line);font-weight:700}
.pc-toast__sub{font-size:var(--text-meta-size);line-height:var(--text-meta-line);color:color-mix(in srgb,var(--color-bg) 72%,var(--color-text))}
.pc-toast__body{font-size:var(--text-body-size);line-height:var(--text-body-line);margin-top:4px!important}
.pc-toast__actions{display:flex;gap:var(--space-2);margin-top:var(--space-2)}
.pc-tbtn{flex:none;min-block-size:40px;padding-inline:var(--space-4);border-radius:999px;background:transparent;color:var(--color-bg);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--color-bg) 70%,transparent);font-weight:700}
.pc-tclose{flex:none;inline-size:32px;block-size:32px;border-radius:999px;background:transparent;color:var(--color-bg);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--color-bg) 55%,transparent)}
/* A11Y round 1: R-B on the shared sheet header Close (the PC mocks call it .pc-close) */
.sheet__header > .icon-button,.dialog__header > .icon-button{flex:none;align-self:flex-start;inline-size:40px;block-size:40px;border-radius:999px;background:transparent;box-shadow:inset 0 0 0 1px var(--color-outline);color:var(--color-text)}
/* A11Y round 1: R-A icon buttons on a tinted container (the dark Today hero is soft-strong) */
[data-scheme='dark'] .tile.plan-hero .icon-button,.tile[data-variant='soft'] .icon-button{background:var(--color-surface);box-shadow:inset 0 0 0 1px var(--color-outline)}
/* A11Y round 1: R-A no bare text button as a sheet action ("Reset to usual Attendance" becomes secondary) */
.sheet__body .button[data-variant='tertiary'][data-size='md']{background:var(--color-surface);box-shadow:inset 0 0 0 1px var(--color-outline);color:var(--color-text)}
.sheet__body .button[data-variant='tertiary'][data-size='md']:disabled{opacity:.38}


/* A11Y-12 theme/palette.ts STATUS_PALETTE.danger.dark.solid (and the dark blocks of styles.css): */
[data-scheme='dark'] [data-after] { --status-danger-solid: #ba4f4b; }
/* A11Y-12 ui/fields/Field.css: no native resize grip; the textarea grows with its text instead */
.ta-after .ui-field__textarea { resize: none; field-sizing: content; min-block-size: calc(3 * var(--text-body-line) + 2 * var(--space-3)); }
</style>
<style data-mock-only>
/* mock-only: draws the focus a keyboard user would see, so several focused controls fit in one picture */
[data-mock-focus] { outline: var(--focus-ring-width) solid var(--focus-ring-color); outline-offset: var(--focus-ring-offset); }
.list-row__target[data-mock-focus] { outline-offset: var(--focus-ring-offset-inset); border-radius: var(--radius-thumb); }
.ui-field__control[data-mock-focus], .search-field__control[data-mock-focus] { border-color: var(--color-accent); outline-offset: 0; }

[data-mock-track-focus] { outline: var(--focus-ring-width) solid var(--focus-ring-color); outline-offset: var(--focus-ring-offset); }

.mk-panel { --field-fill-strong: var(--color-surface-3); --field-rule-color: var(--color-outline); --focus-ring-color: var(--color-accent); --selected-bg: var(--color-soft); --selected-fg: var(--color-accent-text); --selected-ring: var(--color-accent-text); }

body { margin: 0; font-family: Figtree, system-ui, sans-serif; background: #f3f3f3; color: #222; }

.mk-cap b { color: var(--color-text); }
.mk-h { font: 800 15px/20px Figtree, sans-serif; margin: 12px 12px 0; color: #222; }
.mk-sect[data-scheme='dark'] { background: #111; } .mk-sect[data-scheme='dark'] .mk-h { color: #eee; }
</style></head><body>
