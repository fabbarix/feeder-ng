{{- if ne (empty .Values.google.clientId) (empty .Values.google.clientSecret) }}
{{- fail "google.clientId and google.clientSecret must be set together (or use google.existingSecret)" }}
{{- end }}
{{- if and (not .Values.google.existingSecret) (or .Values.google.clientId .Values.google.clientSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "feeder.googleSecretName" . }}
  labels:
    {{- include "feeder.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.google.clientIdKey | quote }}: {{ .Values.google.clientId | quote }}
  {{ .Values.google.clientSecretKey | quote }}: {{ .Values.google.clientSecret | quote }}
{{- end }}
