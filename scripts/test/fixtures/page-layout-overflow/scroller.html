<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>scroller</title>
<!-- The same long chip row inside an intentional scroll container (overflow-x: auto) and minmax(0, 1fr) tracks: no P1, no P13. -->
<style>
  body { margin: 0; font: 15px/20px sans-serif }
  .page { padding: 0 16px; max-width: 720px; margin: 0 auto }
  .bento-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(20rem, 100%), 1fr)) }
  .tile { display: grid; grid-template-columns: minmax(0, 1fr); padding: 16px; border: 1px solid #888; border-radius: 20px }
  .strip { display: flex; gap: 4px; white-space: nowrap; overflow-x: auto }
  .chip { padding: 0 10px; border-radius: 999px; background: #eee }
</style>
<!-- the app marks the scheme it renders; the driver checks it after emulating dark -->
<script>const mq = matchMedia('(prefers-color-scheme: dark)'); const set = () => { document.documentElement.dataset.scheme = mq.matches ? 'dark' : 'light' }; set(); mq.addEventListener('change', set)</script></head><body>
<main><div class="page" data-page-width="narrow"><h1>Settings</h1><div class="bento-grid">
  <section class="tile"><h2>Tags</h2><div class="strip"><span class="chip">Slot Rule: Monday</span><span class="chip">Anna and Ben's favourite</span><span class="chip">Again soon: had Fri</span><span class="chip">Leftover from Sat</span></div></section>
</div></div></main></body></html>
